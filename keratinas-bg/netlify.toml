[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fotos, logos y videos: el celular los guarda un día y no los vuelve a descargar.
# (Si reemplazas un archivo con el mismo nombre, el cambio se ve como máximo al día siguiente
#  en los celulares que ya habían entrado; para verlo de inmediato, usa un nombre nuevo.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
