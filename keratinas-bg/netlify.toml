[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fotos, logos y videos: el navegador siempre pregunta si cambiaron (respuesta muy rápida si no).
# Así, si reemplazas un archivo con el mismo nombre, el cambio se ve de inmediato.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
